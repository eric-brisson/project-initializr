# Runs the API in a container, built from its Dockerfile: docker compose up --build
#if (UseDatabase)
# For development (dotnet run), start only SQL Server: docker compose up -d sqlserver
# The sa password comes from .env (not committed), written by starter-init along with the API's user secrets.
#endif
#if (UseTelemetry)
# For local telemetry with dotnet run, start the dashboard: docker compose up -d dashboard
#endif
# The project name fixes the container, image and volume names, whatever the folder is called.
name: starter-template
services:
  api:
    build:
      context: .
      dockerfile: src/Starter.Template.Api/Dockerfile
    # Production settings (appsettings.json), as when deployed: no Scalar or Swagger UI, which are Development only.
    # Set API_PORT in .env if another app already uses 8080.
    ports:
      - "${API_PORT:-8080}:8080"
#if (UseDatabase || UseTelemetry)
    environment:
#endif
#if (UseDatabase)
      # The database must exist and be migrated (starter-init does both). The password is quoted so a ; in it
      # doesn't end the value, which means it can't contain a double quote.
      ConnectionStrings__Default: 'Server=sqlserver,1433;Database=StarterTemplate;User Id=sa;Password="${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}";TrustServerCertificate=True'
#endif
#if (UseTelemetry)
      # Sends the traces, metrics and logs to the dashboard below.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://dashboard:18889
#endif
#if (UseDatabase)
    depends_on:
      sqlserver:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # Microsoft only publishes amd64 images; Docker Desktop emulates it on Apple Silicon.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    # Set MSSQL_PORT in .env if another SQL Server already uses 1433.
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Applies the scripts of db/migrations: docker compose run --rm flyway
  # In a profile, so "docker compose up" doesn't run it: the database must exist before Flyway runs.
  # The integration tests use the same image (SqlServerDatabase.cs): keep both tags in sync.
  flyway:
    image: flyway/flyway:13.10
    profiles: [migrations]
    command: migrate
    environment:
      FLYWAY_URL: jdbc:sqlserver://sqlserver:1433;databaseName=StarterTemplate;encrypt=true;trustServerCertificate=true
      FLYWAY_USER: sa
      FLYWAY_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    volumes:
      - ./db/migrations:/flyway/sql:ro
    depends_on:
      sqlserver:
        condition: service_healthy
#endif
#if (UseTelemetry)

  # The Aspire dashboard: traces, metrics and logs of the API on http://localhost:18888
  # It receives them over OTLP on port 4317, and keeps them in memory only: they're gone when it stops.
  # Local use only, so without login. Deployed in ARO, the API is instrumented by Dynatrace OneAgent instead.
  dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"
      - "4317:18889"
#endif
#if (UseDatabase)

volumes:
  sqlserver-data:
#endif
