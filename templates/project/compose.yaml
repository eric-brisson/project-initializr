# Exécute l'API dans un conteneur, construit à partir de son Dockerfile : docker compose up --build
#if (UseDatabase)
# Pour le développement (dotnet run), démarrez seulement SQL Server : docker compose up -d sqlserver
# Le mot de passe sa vient de .env (non versionné), écrit par starter-init avec les secrets utilisateur de l'API.
#endif
#if (UseTelemetry)
# Pour la télémétrie locale avec dotnet run, démarrez le tableau de bord : docker compose up -d dashboard
#endif
# Le nom du projet fixe les noms des conteneurs, de l'image et du volume, quel que soit le nom du dossier.
name: starter-template
services:
  api:
    build:
      context: .
      dockerfile: src/Starter.Template.Api/Dockerfile
    # Configuration de Production (appsettings.json), comme une fois déployée : ni Scalar ni Swagger UI, réservés à Development.
    # Définissez API_PORT dans .env si une autre application utilise déjà le port 8080.
    ports:
      - "${API_PORT:-8080}:8080"
#if (UseDatabase || UseTelemetry)
    environment:
#endif
#if (UseDatabase)
      # La base doit exister et être migrée (starter-init fait les deux). Le mot de passe est entre guillemets pour
      # qu'un ; ne coupe pas la valeur : il ne peut donc pas contenir de guillemet double.
      ConnectionStrings__Default: 'Server=sqlserver,1433;Database=StarterTemplate;User Id=sa;Password="${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}";TrustServerCertificate=True'
#endif
#if (UseTelemetry)
      # Envoie les traces, les métriques et les logs au tableau de bord ci-dessous.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://dashboard:18889
#endif
#if (UseDatabase)
    depends_on:
      sqlserver:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # Microsoft ne publie que des images amd64 : Docker Desktop les émule sur Apple Silicon.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    # Définissez MSSQL_PORT dans .env si un autre SQL Server utilise déjà le port 1433.
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Applique les scripts de db/migrations : docker compose run --rm flyway
  # Dans un profil, pour que « docker compose up » ne le lance pas : la base doit exister avant Flyway.
  # Les tests d'intégration utilisent la même image (SqlServerDatabase.cs) : gardez les deux tags identiques.
  flyway:
    image: flyway/flyway:13.10
    profiles: [migrations]
    command: migrate
    environment:
      FLYWAY_URL: jdbc:sqlserver://sqlserver:1433;databaseName=StarterTemplate;encrypt=true;trustServerCertificate=true
      FLYWAY_USER: sa
      FLYWAY_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    volumes:
      - ./db/migrations:/flyway/sql:ro
    depends_on:
      sqlserver:
        condition: service_healthy
#endif
#if (UseTelemetry)

  # Le tableau de bord Aspire : traces, métriques et logs de l'API sur http://localhost:18888
  # Il les reçoit en OTLP sur le port 4317 et les garde en mémoire seulement : elles disparaissent à son arrêt.
  # Usage local uniquement, donc sans connexion. Déployée dans ARO, l'API est instrumentée par Dynatrace OneAgent.
  dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"
      - "4317:18889"
#endif
#if (UseDatabase)

volumes:
  sqlserver-data:
#endif
