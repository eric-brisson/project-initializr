# Local SQL Server for development. The sa password comes from .env (not committed),
# written by starter-init along with the API's user secrets.
# Start it with: docker compose up -d
# The project name fixes the container (starter-template-sqlserver-1) and volume names, whatever the folder is called.
name: starter-template
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # Microsoft only publishes amd64 images; Docker Desktop emulates it on Apple Silicon.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    # Set MSSQL_PORT in .env if another SQL Server already uses 1433.
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Applies the scripts of db/migrations: docker compose run --rm flyway
  # In a profile, so "docker compose up" only starts SQL Server: the database must exist before Flyway runs.
  # The integration tests use the same image (SqlServerDatabase.cs): keep both tags in sync.
  flyway:
    image: flyway/flyway:13.10
    profiles: [migrations]
    command: migrate
    environment:
      FLYWAY_URL: jdbc:sqlserver://sqlserver:1433;databaseName=StarterTemplate;encrypt=true;trustServerCertificate=true
      FLYWAY_USER: sa
      FLYWAY_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    volumes:
      - ./db/migrations:/flyway/sql:ro
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sqlserver-data:
